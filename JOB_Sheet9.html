<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shopping Cart</title>
<script src=""></script>
<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f5f5f5;
        padding: 40px;
    }

    h2 {
        margin-bottom: 15px;
    }

    .cart-container {
        width: 900px;
        margin: auto;
        background: white;
        border: 1px solid #ddd;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    thead {
        background: #f37021;
        color: white;
    }

    th, td {
        padding: 15px;
        text-align: center;
        border: 1px solid #ddd;
    }

    th:first-child,
    td:first-child {
        text-align: left;
    }

    .product {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .product img {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 5px;
    }

    .summary {
        background: #f5e6d3;
        padding: 20px;
        text-align: right;
    }

    .summary p {
        margin: 8px 0;
        font-size: 16px;
    }

    .grand-total {
        color: red;
        font-weight: bold;
        font-size: 18px;
    }
</style>
</head>
<body>
<div class="title">
    <h1>Shopping Cart</h1>
</div>

<table class="table-fill">
    <thead>
        <tr>
            <th colspan="2">Product</th>
            <th>Amount</th>
            <th>Price</th>
            <th>Total</th>
        </tr>
    </thead>

    <tbody id="cartBody"></tbody>

    <tbody>
        <tr class="totals">
            <td colspan="4">Subtotal</td>
            <td id="subtotal"></td>
        </tr>
        <tr class="totals">
            <td colspan="4">Tax (10%)</td>
            <td id="tax"></td>
        </tr>
        <tr class="totals">
            <td colspan="4">Shipping</td>
            <td id="shipping"></td>
        </tr>
        <tr class="totals focus">
            <td colspan="4">Grand Total</td>
            <td id="grand"></td>
        </tr>
    </tbody>
</table>

<script src="scriptjs9.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shopping Cart</title>
<script src=""></script>
<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f5f5f5;
        padding: 40px;
    }

    h2 {
        margin-bottom: 15px;
    }

    .cart-container {
        width: 900px;
        margin: auto;
        background: white;
        border: 1px solid #ddd;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    thead {
        background: #f37021;
        color: white;
    }

    th, td {
        padding: 15px;
        text-align: center;
        border: 1px solid #ddd;
    }

    th:first-child,
    td:first-child {
        text-align: left;
    }

    .product {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .product img {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 5px;
    }

    .summary {
        background: #f5e6d3;
        padding: 20px;
        text-align: right;
    }

    .summary p {
        margin: 8px 0;
        font-size: 16px;
    }

    .grand-total {
        color: red;
        font-weight: bold;
        font-size: 18px;
    }
</style>
</head>
<body>

<div class="cart-container">
    <h2 style="padding:15px;">SHOPPING CART</h2>

    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Amount</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>
                    <div class="product">
                        <img src="Girl with earing.jpeg">
                        <span>Girl with a Pearl Earring</span>
                    </div>
                </td>
                <td>3</td>
                <td>$80.00</td>
                <td>$240.00</td>
            </tr>

            <tr>
                <td>
                    <div class="product">
                        <img src="Artist.jpeg">
                        <span>Artist Holding a Thistle</span>
                    </div>
                </td>
                <td>1</td>
                <td>$125.00</td>
                <td>$125.00</td>
            </tr>

            <tr>
                <td>
                    <div class="product">
                        <img src="Eleanor and Toledo.jpeg">
                        <span>Portrait of Eleanor of Toledo</span>
                    </div>
                </td>
                <td>2</td>
                <td>$75.00</td>
                <td>$150.00</td>
            </tr>
        </tbody>
    </table>

    <div class="summary">
        <p>Subtotal: $515.00</p>
        <p>Tax: $51.50</p>
        <p>Shipping: $40.00</p>
        <p class="grand-total">Grand Total: $606.50</p>
    </div>
</div>

</body>
</html>
